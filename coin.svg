<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Outer Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEFA6" />
      <stop offset="35%" stop-color="#F7BA2A" />
      <stop offset="70%" stop-color="#D48606" />
      <stop offset="100%" stop-color="#8C5300" />
    </linearGradient>

    <!-- Inner Face Gradient -->
    <radialGradient id="goldFace" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFF2A8" />
      <stop offset="40%" stop-color="#FFC01E" />
      <stop offset="80%" stop-color="#E59400" />
      <stop offset="100%" stop-color="#B26500" />
    </radialGradient>

    <!-- Inner Ring Shadow -->
    <linearGradient id="innerRidge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="100%" stop-color="#9E5900" />
    </linearGradient>

    <!-- Text / Symbol Gradient -->
    <linearGradient id="symbolGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE0" />
      <stop offset="50%" stop-color="#FFE270" />
      <stop offset="100%" stop-color="#E29204" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Bevel Shadow for Symbol -->
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#804400" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="50" cy="50" r="46" fill="#F7BA2A" opacity="0.25" filter="url(#goldGlow)" />

  <!-- Outer Coin Rim -->
  <circle cx="50" cy="50" r="44" fill="url(#goldRim)" stroke="#FFF8D1" stroke-width="0.75" />

  <!-- Bevel Ring Depth -->
  <circle cx="50" cy="50" r="41.5" fill="#B26500" opacity="0.5" />
  <circle cx="50" cy="50" r="40" fill="url(#innerRidge)" />

  <!-- Inner Coin Center Face -->
  <circle cx="50" cy="50" r="37.5" fill="url(#goldFace)" />

  <!-- Inner Subtle Texture Ring -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#FFEAA0" stroke-width="1.2" stroke-dasharray="2.5 2" opacity="0.6" />

  <!-- Top Specular Highlight Arc -->
  <path d="M 22 36 A 34 34 0 0 1 78 36" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />

  <!-- Dollar Symbol '$' with 3D Depth -->
  <g filter="url(#symbolShadow)">
    <!-- Dollar Vertical Bar -->
    <rect x="47.5" y="21" width="5" height="58" rx="2.5" fill="url(#symbolGold)" stroke="#D48606" stroke-width="0.5" />
    
    <!-- Dollar 'S' Character -->
    <text x="50" y="65" 
          font-family="'Arial Rounded MT Bold', 'Outfit', 'Inter', sans-serif" 
          font-size="46" 
          font-weight="900" 
          text-anchor="middle" 
          fill="url(#symbolGold)" 
          stroke="#C47500" 
          stroke-width="0.8">
      $
    </text>
  </g>
</svg>
